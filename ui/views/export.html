<div class="page">
    <header class="page-header">
        <div class="page-title">
            <h1>Export</h1>
        </div>

        <div class="page-actions export-toolbar">
            <label class="export-format-label">
                Formato
                <select id="exportFormat" class="export-format-select">
                    <option value="pdf">PDF</option>
                    <option value="excel">Excel</option>
                </select>
            </label>
            <button class="btn" id="btnExportFull">Esporta completo</button>
            <button class="btn btn-secondary" id="btnExportSimple">Esporta semplificato</button>
        </div>
    </header>

    <div class="home-layout-full">
        <section class="calendar-card full-width export-card">
            <div class="export-table-wrap" id="exportTableWrap"></div>
        </section>
    </div>
</div>
