<div class="page employees-page">
    <div class="page-header">
        <h2>Dipendenti</h2>
        <div class="row gap">
            <button id="btnEmpNew" class="btn primary">+ Aggiungi</button>
            <button id="btnEmpRefresh" class="btn">Aggiorna</button>
        </div>
    </div>

    <div class="panel">
        <div class="table-wrap">
            <table class="table" id="empTable">
                <thead>
                <tr>
                    <th>Nome</th>
                    <th>Tempo indeterminato</th>
                    <th>Mansione preferita</th>
                    <th>Skill (1–5)</th>
                    <th style="width:160px">Azioni</th>
                </tr>
                </thead>
                <tbody id="empTbody"></tbody>
            </table>
        </div>
    </div>
</div>

<div class="modal-backdrop" id="empModalBackdrop" style="display:none">
    <div class="modal" style="max-width:760px">
        <div class="modal-head">
            <div class="modal-title" id="empModalTitle">Dipendente</div>
            <button class="modal-close" id="empModalClose">✕</button>
        </div>

        <div class="modal-body">
            <div class="form-grid">
                <div class="form-field">
                    <label>Nome</label>
                    <input id="empName" type="text" placeholder="Es. RANIERO" />
                </div>

                <div class="form-field">
                    <label>Tempo indeterminato</label>
                    <label class="switch">
                        <input id="empPermanent" type="checkbox" />
                        <span class="slider"></span>
                    </label>
                </div>

                <div class="form-field">
                    <label>Slot-orario</label>
                    <div class="check-row">
                        <label class="check">
                            <input id="empSlotMorning" type="checkbox" checked />
                            <span>Mattina</span>
                        </label>
                        <label class="check">
                            <input id="empSlotEvening" type="checkbox" checked />
                            <span>Pomeriggio</span>
                        </label>
                    </div>
                </div>

                <div class="form-field">
                    <label>Mansione preferita (opzionale)</label>
                    <select id="empPreferredRole">
                        <option value="">(vuota)</option>
                        <option value="Cassa">Cassa</option>
                        <option value="Runner">Runner</option>
                        <option value="Bar">Bar</option>
                        <option value="Comande">Comande</option>
                        <option value="Accoglienza">Accoglienza</option>
                        <option value="Jolly">Jolly</option>
                    </select>
                </div>
            </div>

            <details class="emp-adv" style="margin-top:12px">
                <summary class="emp-adv-summary">Avanzate (skill)</summary>
                <div class="subhead" style="margin-top:10px">Skill per mansione (1–5)</div>
                <div class="skills-grid" id="empSkillsGrid"></div>
            </details>

            <div class="row gap end" style="margin-top:14px">
                <button class="btn" id="empModalCancel">Annulla</button>
                <button class="btn primary" id="empModalSave">Salva</button>
            </div>
        </div>
    </div>
</div>
