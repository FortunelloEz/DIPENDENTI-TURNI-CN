<div class="page">
    <header class="page-header">
        <div class="page-title">
            <h1>Homepage</h1>
            <p>Applicazione gestionale dei turni di lavoro in CASCINA NASCOSTA</p>
        </div>

        <div class="page-actions home-actions">
            <div class="home-actions-group">
                <button class="btn" id="btnImportAvailability">📥 Importa CSV</button>
                <button class="btn" id="btnElaboraWeek">⚙️ Elabora settimana</button>
            </div>
            <div class="home-actions-sep"></div>
            <div class="home-actions-group">
                <button class="btn btn-ghost" id="btnTodayTop">📅 Settimana corrente</button>
                <button class="btn btn-ghost" id="btnClear">🗑 Svuota</button>
            </div>
        </div>

        <div id="availabilityActions"></div>
    </header>

    <div id="quickAddBar" class="quick-add-bar">
        <div class="qa-title">Inserimento rapido</div>
        <div class="qa-row">
            <div class="qa-field">
                <label class="qa-label">Dipendente</label>
                <select id="qaEmployee" class="quick-add-select">
                    <option value="">Seleziona dipendente...</option>
                </select>
            </div>
            <div class="qa-field">
                <label class="qa-label">Giorno</label>
                <select id="qaDay" class="quick-add-select">
                    <option value="">Seleziona giorno...</option>
                </select>
            </div>
            <div class="qa-field">
                <label class="qa-label">Mansione</label>
                <select id="qaRole" class="quick-add-select">
                    <option value="">Seleziona mansione...</option>
                </select>
            </div>
            <div class="qa-field">
                <label class="qa-label">Dalle</label>
                <select id="qaFrom" class="quick-add-select">
                    <option value="">--</option>
                </select>
            </div>
            <div class="qa-field">
                <label class="qa-label">Alle</label>
                <select id="qaTo" class="quick-add-select">
                    <option value="">--</option>
                </select>
            </div>
            <div class="qa-field qa-field--action">
                <label class="qa-label">&nbsp;</label>
                <button class="btn qa-btn" id="qaConfirm">+ Aggiungi</button>
            </div>
        </div>
    </div>

    <div class="home-layout home-layout-full">
        <!-- CALENDARIO -->
        <section class="calendar-card full-width">
            <div class="calendar-head">
                <div class="calendar-left">
                    <div class="calendar-meta" id="weekLabel">Settimana:</div>
                    <div class="week-nav">
                        <button class="btn btn-small btn-ghost" id="btnPrevWeek">←</button>
                        <button class="btn btn-small btn-ghost" id="btnNextWeek">→</button>
                        <button class="btn btn-small" id="btnToday">Oggi</button>
                    </div>
                </div>
                <div class="legend">
                    <span class="dot dot-empty"></span><span>Vuoto</span>
                    <span class="dot dot-filled"></span><span>Assegnato</span>
                </div>
            </div>
            <div class="calendar-wrap">
                <div class="calendar-grid" id="calendarGrid"></div>
            </div>
        </section>

        <!-- RIEPILOGO TIPOLOGIA GIORNATA -->
        <section class="calendar-card day-summary-card day-summary-card--bar">
            <div class="calendar-head">
                <div class="calendar-meta">Tipologia giornata settimana</div>
            </div>
            <div class="day-summary-body" id="daySummaryBody">
                <!-- generato da JS -->
            </div>
        </section>
    </div>
</div>
