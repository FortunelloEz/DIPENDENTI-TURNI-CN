<div class="page home-page">
    <header class="page-header home-header">
        <div class="page-title">
            <h1>Homepage</h1>
            <p>Gestione turni — Cascina Nascosta</p>
        </div>

        <div class="home-actions">
            <div class="home-actions-group">
                <button class="btn" id="btnImportAvailability">📥 Importa CSV</button>
                <button class="btn" id="btnElaboraSelectedFile" disabled title="Seleziona un file dalla lista per elaborarlo">⚙️ Elabora file selezionato</button>
                <button class="btn primary" id="btnElaboraWeek">📊 Elabora tabella Export</button>
            </div>
            <div class="home-actions-sep"></div>
            <div class="home-actions-group">
                <button class="btn btn-ghost" id="btnTodayTop">📅 Settimana corrente</button>
                <button class="btn btn-ghost" id="btnClear">🗑 Svuota</button>
            </div>
        </div>

        <div id="availabilityActions"></div>
    </header>

    <div class="home-main-layout">

        <!-- PANNELLO LATERALE FILE CSV -->
        <aside class="csv-panel">
            <div class="csv-panel-head">
                <span class="csv-panel-title">File CSV caricati</span>
                <button class="btn btn-ghost btn-small" id="btnClearAllFiles" title="Elimina tutti i file dalla lista">🗑 Elimina tutti</button>
            </div>
            <div class="csv-file-list" id="csvFileList">
                <div class="csv-empty-hint">Nessun file caricato</div>
            </div>
        </aside>

        <!-- AREA DESTRA -->
        <div class="home-right-area">

            <section class="calendar-card">
                <div class="calendar-head">
                    <div class="calendar-left">
                        <div class="calendar-meta" id="weekLabel">Settimana:</div>
                        <div class="week-nav">
                            <button class="btn btn-small btn-ghost" id="btnPrevWeek">←</button>
                            <button class="btn btn-small btn-ghost" id="btnNextWeek">→</button>
                            <button class="btn btn-small" id="btnToday">Oggi</button>
                        </div>
                    </div>
                </div>

                <!-- LEGENDA RUOLI -->
                <div class="role-legend" id="roleLegend">
                    <span class="role-legend-item"><span class="tl-role-pill tl-role-cassa">C</span> Cassa</span>
                    <span class="role-legend-item"><span class="tl-role-pill tl-role-runner">R</span> Runner</span>
                    <span class="role-legend-item"><span class="tl-role-pill tl-role-bar">B</span> Bar</span>
                    <span class="role-legend-item"><span class="tl-role-pill tl-role-comande">Co</span> Comande</span>
                    <span class="role-legend-item"><span class="tl-role-pill tl-role-accoglienza">A</span> Accoglienza</span>
                    <span class="role-legend-item"><span class="tl-role-pill tl-role-jolly">J</span> Jolly</span>
                    <span class="role-legend-hint">Clicca giorno (header) per riepilogo · clicca cella per gestire il turno</span>
                </div>

                <div class="timeline-wrap" id="timelineWrap">
                    <table class="timeline-table" id="timelineTable"></table>
                </div>
            </section>

            <!-- RIEPILOGO TIPOLOGIA GIORNATA -->
            <section class="calendar-card day-summary-card day-summary-card--bar">
                <div class="calendar-head">
                    <div class="calendar-meta">Tipologia giornata settimana</div>
                </div>
                <div class="day-summary-body" id="daySummaryBody"></div>
            </section>
        </div>
    </div>
</div>

<!-- ====== MODAL: DETTAGLIO GIORNO ====== -->
<div class="modal-backdrop" id="dayModalBackdrop" style="display:none">
    <div class="modal day-modal">
        <div class="modal-head">
            <div class="modal-title" id="dayModalTitle">Dettaglio giorno</div>
            <button class="modal-close" id="dayModalClose">✕</button>
        </div>
        <div class="modal-body" id="dayModalBody"></div>
        <!-- footer nascosto: i bottoni qa/qd ora sono nel modal gestione turno -->
        <div class="modal-actions" style="display:none">
            <button class="btn btn-ghost" id="dayModalQdBtn">➖ Eliminazione rapida</button>
            <button class="btn primary" id="dayModalQaBtn">➕ Inserimento rapido</button>
        </div>
    </div>
</div>
