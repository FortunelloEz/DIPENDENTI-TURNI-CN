<div class="page">
    <header class="page-header">
        <div class="page-title">
            <h1>Homepage</h1>
            <p>Applicazione gestionale dei turni di lavoro in CASCINA NASCOSTA</p>
        </div>

        <div class="page-actions">
            <button class="btn" id="btnTodayTop">Settimana corrente</button>
            <button class="btn" id="btnPermManage">Gestisci indeterminati</button>
            <button class="btn" id="btnEditSquads">Modifica squadre settimana</button>
            <button class="btn btn-ghost" id="btnClear">Svuota Settimana</button>
        </div>
    </header>

    <div class="home-layout">
        <!-- CALENDARIO -->
        <section class="calendar-card">
            <div class="calendar-head">
                <div class="calendar-left">
                    <div class="calendar-meta" id="weekLabel">Settimana:</div>

                    <div class="week-nav">
                        <button class="btn btn-small btn-ghost" id="btnPrevWeek">←</button>
                        <button class="btn btn-small btn-ghost" id="btnNextWeek">→</button>
                        <button class="btn btn-small" id="btnToday">Oggi</button>
                    </div>
                </div>

                <div class="legend">
                    <span class="dot dot-empty"></span><span>Vuoto</span>
                    <span class="dot dot-filled"></span><span>Assegnato</span>
                </div>
            </div>

            <div class="calendar-wrap">
                <div class="calendar-grid" id="calendarGrid"></div>
            </div>
        </section>

        <!-- MENU DX (solo homepage) -->
        <aside class="rightbar">
            <button class="accordion right-acc open" data-acc="employees">
                <span class="acc-ic">👥</span>
                <span class="acc-txt">Dipendenti</span>
                <span class="chev">▾</span>
            </button>

            <div class="panel open" id="acc-employees">
                <div class="emp-list" id="empList"></div>

                <div class="hint">
                    Tip: clicca una cella del calendario per assegnare un dipendente.
                </div>
            </div>
        </aside>
    </div>
</div>
