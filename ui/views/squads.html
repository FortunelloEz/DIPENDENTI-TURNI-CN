<div class="page">

    <header class="page-header">
        <div class="page-title">
            <h1>Squadre</h1>
        </div>

        <div class="page-actions squads-actions">

            <div class="squads-row-top">
                <button class="btn btn-ghost" id="btnSquadsSaveTemplate">
                    Salva template
                </button>

                <span class="chip" id="squadsSaveStatus">Pronto</span>
                <button class="btn btn-danger" id="btnSquadsDeleteTemplate">Elimina template</button>

            </div>

            <div class="squads-row-bottom">
                <select id="squadsTemplateSelect" class="select"></select>

                <button class="btn" id="btnSquadsApplyTemplate">
                    Applica
                </button>

                <button class="btn btn-ghost" id="btnSquadsUndo" disabled>
                    Annulla
                </button>
            </div>

        </div>
    </header>

    <section class="calendar-card">
        <div class="calendar-head">
            <div class="calendar-left">
                <div class="calendar-meta" id="squadsWeekLabel">Squadre</div>
            </div>
        </div>

        <div class="calendar-wrap">
            <div class="calendar-grid" style="padding:12px">
                <table class="squad-table" id="squadsTable"></table>
            </div>
        </div>
    </section>
    <!-- SEZIONE: Tipi giornata -->
    <section class="calendar-card day-types-card">
        <div class="calendar-head">
            <div class="calendar-left">
                <div class="calendar-meta">Tipi giornata — applica un preset ai giorni</div>
            </div>
            <button class="btn btn-ghost btn-small" id="btnEditDayTypes">✏️ Modifica preset</button>
        </div>

        <div class="day-types-body" id="dayTypesBody">
            <!-- generato da JS -->
        </div>
    </section>

    <!-- MODAL: Modifica preset tipi giornata -->
    <div class="modal-backdrop hidden" id="dayTypeEditModal">
        <div class="modal-card modal-card-wide" role="dialog" aria-modal="true">
            <div class="modal-head">
                <div class="modal-title">Modifica preset tipi giornata</div>
                <button class="modal-close" id="dayTypeEditClose">✕</button>
            </div>
            <div class="modal-body">
                <div class="day-type-tabs" id="dayTypeEditTabs">
                    <!-- tab Leggera / Normale / Pesante -->
                </div>
                <div class="day-type-edit-content" id="dayTypeEditContent">
                    <!-- tabella ruoli per il tipo selezionato -->
                </div>
            </div>
            <div class="modal-actions">
                <button class="btn btn-ghost" id="dayTypeEditCancel">Annulla</button>
                <button class="btn" id="dayTypeEditSave">Salva preset</button>
            </div>
        </div>
    </div>
    <!-- MODAL: Conferma eliminazione template -->
    <div class="modal-backdrop hidden" id="tplDeleteModal">
        <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="tplDeleteTitle">
            <div class="modal-head">
                <div class="modal-title" id="tplDeleteTitle">Elimina template</div>
                <button class="modal-close" id="tplDeleteClose" aria-label="Chiudi">✕</button>
            </div>

            <div class="modal-body">
                <div class="modal-hint" id="tplDeleteText">Eliminare il template?</div>
            </div>

            <div class="modal-actions">
                <button class="btn btn-ghost" id="tplDeleteCancel">Annulla</button>
                <button class="btn btn-danger" id="tplDeleteConfirm">Elimina</button>
            </div>
        </div>
    </div>
    <!-- MODAL: Salva Template -->
    <div class="modal-backdrop hidden" id="tplModal">
        <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="tplTitle">

            <div class="modal-head">
                <div class="modal-title" id="tplTitle">Salva template</div>
                <button class="modal-close" id="tplClose" aria-label="Chiudi">✕</button>

            </div>

            <div class="modal-body">
                <input
                        class="modal-input"
                        id="tplName"
                        placeholder="Nome univoco (es. 'Inverno 2026')"
                />
                <div class="modal-hint">
                    Il nome deve essere unico. Il template salva i valori attuali della settimana.
                </div>
            </div>

            <div class="modal-actions">
                <button class="btn btn-ghost" id="tplCancel">Annulla</button>
                <button class="btn" id="tplSave">Salva</button>
            </div>

        </div>
    </div>

</div>
