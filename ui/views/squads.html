<div class="page">
    <header class="page-header">
        <div class="page-title">
            <h1>Squadre</h1>
            <p>Fabbisogno per giorno e fascia (mattina/pomeriggio). Le modifiche si salvano automaticamente.</p>
        </div>

        <div class="page-actions">
            <button class="btn btn-ghost" id="btnSquadsReload">Ricarica da DB</button>
            <span class="chip" id="squadsSaveStatus">Pronto</span>
        </div>
    </header>

    <section class="calendar-card">
        <div class="calendar-head">
            <div class="calendar-left">
                <div class="calendar-meta" id="squadsWeekLabel">Settimana:</div>

                <div class="week-nav">
                    <button class="btn btn-small btn-ghost" id="btnSquadsPrevWeek">←</button>
                    <button class="btn btn-small btn-ghost" id="btnSquadsNextWeek">→</button>
                    <button class="btn btn-small" id="btnSquadsToday">Oggi</button>
                </div>
            </div>
        </div>

        <div class="calendar-wrap">
            <div class="calendar-grid" style="padding:12px">
                <table class="squad-table" id="squadsTable"></table>
            </div>
        </div>
    </section>
</div>
