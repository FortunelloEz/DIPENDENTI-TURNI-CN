<!doctype html>
<html lang="it">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Turni CN</title>
    <link rel="stylesheet" href="customization/app.css" />
    <link rel="stylesheet" href="customization/employees.css" />
    <link rel="stylesheet" href="customization/calendar.css" />
    <link rel="stylesheet" href="customization/db.css" />
    <link rel="stylesheet" href="customization/squad.css" />
    <link rel="stylesheet" href="customization/import_resolver.css" />
    <link rel="stylesheet" href="./customization/availability_viewer.css">
    <link rel="stylesheet" href="./customization/popup_select_fix.css">
    <link rel="stylesheet" href="customization/export.css" />
    <link rel="stylesheet" href="customization/report.css" />
    <link rel="stylesheet" href="customization/chat_ai.css" />
    <link rel="stylesheet" href="customization/guide.css" />
    <!-- design system: sempre per ultimo -->
    <link rel="stylesheet" href="customization/ui_kit.css" />
</head>
<body>
<div class="app">
    <!-- SIDEBAR SINISTRA (globale) -->
    <aside class="sidebar" aria-label="Navigazione principale">
        <div class="sb-brand">
            <div class="sb-logo" aria-hidden="true">CN</div>
            <div class="sb-brand-text">
                <div class="sb-brand-title">Turni CN</div>
                <div class="sb-brand-sub">Cascina Nascosta</div>
            </div>
            <button type="button" class="sb-toggle" id="sbToggle" aria-label="Riduci la barra laterale" title="Riduci la barra laterale">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
            </button>
        </div>

        <nav class="sb-nav">
            <div class="sb-section">Gestione</div>
            <button class="nav-item active" data-route="home" title="Homepage">
                <svg class="nav-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V9.5"/></svg>
                <span class="nav-txt">Homepage</span>
            </button>
            <button class="nav-item" data-route="employees" title="Dipendenti">
                <svg class="nav-ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.4 3.3-5.5 6.5-5.5s5.9 2.1 6.5 5.5"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8"/><path d="M18 14.8c1.9.7 3.2 2.5 3.5 5.2"/></svg>
                <span class="nav-txt">Dipendenti</span>
            </button>
            <button class="nav-item" data-route="squads" title="Squadre">
                <svg class="nav-ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M3 10h18M9 10v10"/></svg>
                <span class="nav-txt">Squadre</span>
            </button>
            <div class="sb-section">Risultati</div>
            <button class="nav-item" data-route="export" title="Export">
                <svg class="nav-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M4 17v2.5A1.5 1.5 0 0 0 5.5 21h13a1.5 1.5 0 0 0 1.5-1.5V17"/></svg>
                <span class="nav-txt">Export</span>
            </button>
            <button class="nav-item" data-route="report" title="Report">
                <svg class="nav-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
                <span class="nav-txt">Report</span>
            </button>
        </nav>

        <div class="sidebar-footer">
            <button class="nav-item" data-route="guide" title="Guida all'uso">
                <svg class="nav-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
                <span class="nav-txt">Guida</span>
            </button>
            <div class="sb-version" id="sbVersion"></div>
        </div>
    </aside>

    <!-- CONTENUTO -->
    <main class="content">
        <div id="view"></div>
    </main>
</div>

<script src="./assets/ui_kit.js"></script>
<script src="./assets/db_adapter.js"></script>
<script src="./assets/employees.js"></script>
<script src="./assets/import_resolver.js"></script>
<script src="./assets/custom_slot_resolver.js"></script>
<script src="./assets/import_availability.js"></script>
<script src="./assets/availability_viewer.js"></script>
<script src="./assets/export.js"></script>
<script src="./assets/app.js"></script>
<script src="./assets/squads.js"></script>
<script src="./assets/report.js"></script>
<script src="./assets/chat_ai.js"></script>

</body>
</html>
